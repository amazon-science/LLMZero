# SageMaker Configuration

per_execution_timeout: 18000

# Data Perception
max_file_group_size_to_show: 5
num_example_files_to_show: 1

max_chars_per_file: 768
num_tutorial_retrievals: 30
max_num_tutorials: 5
max_user_input_length: 2048
max_error_message_length: 2048
max_tutorial_length: 32768
configure_env: false
condense_tutorials: True
use_tutorial_summary: True
stop_after_success: False
optimize_system_resources: False
cleanup_unused_env: True

llm: &default_llm
  provider: openai
  model: gpt-5-2025-08-07
  max_tokens: 65535
  proxy_url: null
  temperature: 0.1
  top_p: 0.9
  verbose: True
  multi_turn: False
  template: null
  add_coding_format_instruction: false

executer:
  <<: *default_llm  # Merge llm_config
  max_stdout_length: 8192
  max_stderr_length: 2048

error_analyzer:
  <<: *default_llm  # Merge llm_config

agentic_proposer:
  num_samples: 20         # Number of uniform samples for training/validation metrics
  use_average: true       # Whether to average within segments (true) or sample at points (false)
